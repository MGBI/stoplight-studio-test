openapi: 3.0.0
info:
  title: Dokumentacja API serwisu iMSiG.pl - KRS API, MSIG API, KRZ API
  version: 1.0.487
  description: "# Og\xF3lne informacje\nAPI oparte jest na protokole HTTP, a tre\u015B\
    \u0107 wszystkich \u017C\u0105da\u0144 i odpowiedzi\nprzekazywana jest w formie\
    \ obiekt\xF3w j\u0119zyka JavaScript (JSON).\n\nW nag\u0142\xF3wku HTTP `Content-Type`\
    \ ka\u017Cdego \u017C\u0105dania API przesy\u0142anego metod\u0105 POST\ni zawieraj\u0105\
    cego w tre\u015Bci obiekt JSON nale\u017Cy ustawi\u0107 warto\u015B\u0107 `application/json`.\n\
    \nW \u017C\u0105daniach API przesy\u0142anych metod\u0105 GET parametry nale\u017C\
    y umie\u015Bci\u0107 w query\nstringu.\n\nKa\u017Cda metoda API mo\u017Ce zwr\xF3\
    ci\u0107 jeden z kilku mo\u017Cliwych kod\xF3w odpowiedzi HTTP.\nNag\u0142\xF3\
    wki i parametry odpowiedzi opisane poni\u017Cej dla ka\u017Cdej z metod zwracane\
    \ s\u0105\ntylko dla kodu 200 (OK).\n\n# Autentykacja\n<SecurityDefinitions />\n"
  x-logo:
    url: https://www.imsig.pl/layout/monitor_sadowy_i_gospodarczy.png
    altText: iMSiG.pl
  contact:
    url: https://api.imsig.pl
    name: MGBI sp. z o.o.
    email: info@imsig.pl
tags:
- x-displayName: "Og\u0142oszenia"
  name: announcements_iapi
  description: "Interfejs programistyczny serwisu iMSiG.pl umo\u017Cliwia wyszukiwanie\
    \ i pobieranie\noryginalnej tre\u015Bci og\u0142osze\u0144 publikowanych w Monitorze\
    \ S\u0105dowym i Gospodarczym (MSiG)\noraz w Krajowym Rejestrze Zad\u0142u\u017C\
    onych (KRZ), a tak\u017Ce wyodr\u0119bnionych z nich danych\nw ustrukturyzowanej\
    \ formie.\n\nW obecnej wersji API umo\u017Cliwia dost\u0119p do og\u0142osze\u0144\
    \ dotycz\u0105cych post\u0119powa\u0144 upad\u0142o\u015Bciowych\ni restrukturyzacyjnych,\
    \ pochodz\u0105cych z numer\xF3w MSiG wydanych (od 1 stycznia 2001 r.)\noraz z\
    \ KRZ (od 1 grudnia 2021 r.).\n\nInformacje o zasadach korzystania z interfejsu\
    \ dost\u0119pne s\u0105 na stronie us\u0142ugi [Lista upad\u0142o\u015Bci](https://www.imsig.pl/lista-upadlosci).\n\
    \nS\u0142owa kluczowe:\n* Monitor S\u0105dowy i Gospodarczy API (MSIG API)\n*\
    \ Krajowy Rejestr Zad\u0142u\u017Conych API (KRZ API)\n\n\n## \u0179r\xF3d\u0142\
    o danych\nMonitor S\u0105dowy i Gospodarczy (MSiG) to oficjalny dziennik urz\u0119\
    dowy, w kt\xF3rym publikowane\ns\u0105 og\u0142oszenia s\u0105dowe m.in. na podstawie\
    \ przepis\xF3w kodeksu sp\xF3\u0142ek handlowych, kodeksu\npost\u0119powania cywilnego\
    \ i prawa upad\u0142o\u015Bciowego. Nowe numery dziennika s\u0105 udost\u0119\
    pniane\ncodziennie w formie plik\xF3w PDF na [stronie Ministerstwa Sprawiedliwo\u015B\
    ci](https://ems.ms.gov.pl/msig/przegladaniemonitorow).\n\nKrajowy Rejestr Zad\u0142\
    u\u017Conych (KRZ) to system teleinformatyczny Ministerstwa Sprawiedliwo\u015B\
    ci,\nw kt\xF3rym gromadzone s\u0105 wszystkie informacje i dokumenty dotycz\u0105\
    ce przebiegu post\u0119powa\u0144\nupad\u0142o\u015Bciowych i restrukturyzacyjnych\
    \ prowadzonych przez polskie s\u0105dy (od 1 grudnia 2021 r.).\n\n\n## Ustrukturyzowane\
    \ informacje\nFormat pliku, w jakim udost\u0119pniany jest Monitor S\u0105dowy\
    \ i Gospodarczy, nie umo\u017Cliwia\n\u0142atwego wyszukiwania og\u0142osze\u0144\
    \ dotycz\u0105cych poszczeg\xF3lnych os\xF3b fizycznych lub podmiot\xF3w.\nTre\u015B\
    \u0107 og\u0142osze\u0144 jest nieustrukturyzowana, co uniemo\u017Cliwia dalsze\
    \ przetwarzanie zawartych\nw niej informacji.\n\nNasz interfejs programistyczny\
    \ umo\u017Cliwia przeszukiwanie bazy og\u0142osze\u0144 opublikowanych\nw MSiG\
    \ oraz KRZ na podstawie kilku r\xF3\u017Cnych kryteri\xF3w, pobieranie ich oryginalnej\
    \ wersji w dw\xF3ch\nformatach, a tak\u017Ce dost\u0119p do wybranych informacji\
    \ wyodr\u0119bnionych z tekstowej tre\u015Bci.\n\nAby sprawdzi\u0107, jakie og\u0142\
    oszenia publikowane s\u0105 w MSiG, przejd\u017A na [stron\u0119 g\u0142\xF3wn\u0105\
    \ serwisu iMSiG.pl](\nhttps://www.imsig.pl).\n\n\n## Masowy dost\u0119p\nWyszukiwarka\
    \ og\u0142osze\u0144 dost\u0119pna na stronie Ministerstwa Sprawiedliwo\u015B\
    ci nie jest\nprzeznaczona do masowego dost\u0119pu do bazy og\u0142osze\u0144\
    . Nie zosta\u0142o r\xF3wnie\u017C\nudost\u0119pnione oficjalne API do integracji\
    \ z systemami teleinformatycznymi.\n\nW ramach naszego interfejsu programistycznego\
    \ udost\u0119pniamy szereg kryteri\xF3w do\nprzeszukiwania bazy og\u0142osze\u0144\
    \ dost\u0119pnych w systemie KRZ jak i MSiG. Umo\u017Cliwia to\nmasowe pobieranie\
    \ dokument\xF3w bez konieczno\u015Bci r\u0119cznego sprawdzania og\u0142osze\u0144\
    \nw dw\xF3ch r\xF3\u017Cnych systemach.\n\nDodatkowo, wszystkie udost\u0119pniane\
    \ przez nas og\u0142oszenia s\u0105 uzupe\u0142niane o pomini\u0119te\nw publicznym\
    \ portalu dane doradc\xF3w restukturyzacyjnych oraz dane rejestrowe\npodmiot\xF3\
    w, kt\xF3rych dotycz\u0105 og\u0142oszenia."
- x-displayName: Filtry
  name: filters_iapi
  description: "Udost\u0119pniamy mo\u017Cliwo\u015B\u0107 utworzenia filtra na potrzeby\
    \ monitorowania wybranych\npodmiot\xF3w, os\xF3b czy post\u0119powa\u0144. W ten\
    \ spos\xF3b, w tworzonych raportach mo\u017Cemy\nzaw\u0119zi\u0107 list\u0119\
    \ og\u0142osze\u0144 do:\n* podmiot\xF3w z wybranej listy numer\xF3w NIP, REGON\
    \ albo KRS,\n* os\xF3b fizycznych z wybrabej listy numer\xF3w PESEL albo listy\
    \ imion i nazwisk,\n* post\u0119powa\u0144 z wybranej listy sygnatur z MSiG albo\
    \ KRZ."
- x-displayName: Raporty
  name: reports_iapi
  description: "Udost\u0119pniamy mechanizm tworzenia plik\xF3w z list\u0105 og\u0142\
    osze\u0144 opublikowanych\nw wybranym zakresie dat. Wygenerowane archiwum ZIP\
    \ zawiera plik w jednym\nze wskazanych format\xF3w: CSV, XLSX, XML, JSON albo\
    \ DEF."
- x-displayName: "S\u0142owniki"
  name: dicts_iapi
  description: "Etykiety dla zwracanych sta\u0142ych."
- x-displayName: "U\u017Cytkownicy"
  name: users_iapi
  description: "Informacje o aktualnym u\u017Cytkowniku."
- x-displayName: Aktualizacje
  name: updates_iapi
  description: "Udost\u0119pniamy podgl\u0105d na aktualizacje naszej wewn\u0119trznej\
    \ bazy og\u0142osze\u0144.\nW ten spos\xF3b mo\u017Cemy sprawdzi\u0107 aktualno\u015B\
    \u0107 naszych danych."
- x-displayName: Parametry
  name: params_iapi
  description: "Parametry us\u0142ugi przypisane do u\u017Cytkownika."
- x-displayName: Monitoringi
  name: monitors_iapi
  description: "Udost\u0119pniamy mo\u017Cliwo\u015B\u0107 monitorowania nowych og\u0142\
    osze\u0144 w ramach list\nidentyfikator\xF3w podanych w filtrze. Na wskazane adresy\
    \ e-mail b\u0119dzie\nraz dziennie wysy\u0142ana wiadomo\u015B\u0107 o nowych\
    \ og\u0142oszeniach dotycz\u0105cych wybranych\npodmiot\xF3w, os\xF3b b\u0105\
    d\u017A sygnatur."
- x-displayName: Powiadomienia
  name: notifications_iapi
  description: "Udost\u0119pniamy podgl\u0105d na list\u0119 powiadomie\u0144 o nowych\
    \ og\u0142oszeniach w ramach\nzdefiniowanych monitoring\xF3w."
x-tagGroups:
- name: MSIG API V2, KRZ API V2
  tags:
  - announcements_iapi
  - updates_iapi
  - filters_iapi
  - reports_iapi
  - monitors_iapi
  - notifications_iapi
  - users_iapi
  - params_iapi
  - dicts_iapi
paths:
  /v2/filters:
    get:
      tags:
      - filters_iapi
      summary: GET /v2/filters
      operationId: get_actual_user_filters_v2_filters_get
      parameters:
      - required: false
        schema:
          title: Exclude
          type: array
          items:
            enum:
            - content
            - items_count
            type: string
        name: exclude
        in: query
        description: "Pola, kt\xF3re nie b\u0119d\u0105 zwr\xF3cone w odpowiedzi.\n\
          <details><summary>Poka\u017C mo\u017Cliwe opcje</summary>\n\n| Warto\u015B\
          \u0107 | Nazwa  |\n|-|-|\n| `content` | Zawarto\u015B\u0107 filtra |\n|\
          \ `items_count`| Liczba wszystkich identyfikator\xF3w w filtrze |</details>"
        example:
        - content
        - items_count
      - required: false
        schema:
          title: Authorization
          type: string
        example: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
        name: Authorization
        in: header
        description: Klucz autoryzacji
      responses:
        '200':
          description: "Wynik wyszukiwania filtr\xF3w aktualnego u\u017Cytkownika"
          content:
            application/json:
              schema:
                title: Response Get Actual User Filters V2 Filters Get
                type: array
                items:
                  $ref: '#/components/schemas/FiltersModel'
        '400':
          description: "Niew\u0142a\u015Bciwy format zapytania"
          content:
            application/json:
              schema:
                example:
                  error: Validation error
                  details:
                  - loc:
                    - query
                    - exclude
                    msg: 'unexpected value; permitted: ''content'', ''items_count'''
                    type: value_error.const
                    ctx:
                      given: ''
                      permitted:
                      - content
                      - items_count
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Niepoprawna autentykacja tokenu
          content:
            application/json:
              schema:
                example:
                  error: Unauthorized
                  details: User token not provided
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: "Nieudana autoryzacja dost\u0119pu do API"
          content:
            application/json:
              schema:
                example:
                  error: Forbidden
                  details: Incorrect user token
                items:
                  $ref: '#/components/schemas/Error'
      description: "Zwraca list\u0119 filtr\xF3w przypisanych do aktualnego u\u017C\
        ytkownika."
      components:
        schemas:
          $ref: '#/components/schemas'
    post:
      tags:
      - filters_iapi
      summary: POST /v2/filters
      operationId: create_filter_v2_filters_post
      parameters:
      - required: false
        schema:
          title: Authorization
          type: string
        example: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
        name: Authorization
        in: header
        description: Klucz autoryzacji
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFiltersModel'
        required: true
      responses:
        '200':
          description: Wynik utworzenia nowego filtra
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullFiltersModel'
        '400':
          description: "Niew\u0142a\u015Bciwy format zapytania"
          content:
            application/json:
              schema:
                example:
                  error: Validation error
                  details:
                  - loc:
                    - body
                    - content
                    - __root__
                    msg: Filter content cannot be empty
                    type: value_error
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Niepoprawna autentykacja tokenu
          content:
            application/json:
              schema:
                example:
                  error: Unauthorized
                  details: User token not provided
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: "Nieudana autoryzacja dost\u0119pu do API"
          content:
            application/json:
              schema:
                example:
                  error: Forbidden
                  details: Incorrect user token
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: "Wykorzystany limit zapyta\u0144 do API"
          content:
            application/json:
              schema:
                example:
                  error: Too Many Requests
                  details: You have specified too many filter items. Your limit items
                    of filter is 100.
                items:
                  $ref: '#/components/schemas/Error'
      description: "Tworzy nowy filtr przypisany do aktualnego u\u017Cytkownika.\n\
        \nW parametrze `content` podajemy przynajmniej jeden identyfikator dowolnego\n\
        typu. \u0141\u0105czna liczba przekazanych w \u017C\u0105daniu identyfikator\xF3\
        w nie mo\u017Ce przekracza\u0107\nwarto\u015Bci `filter_items_limit` z parametr\xF3\
        w us\u0142ugi."
      components:
        schemas:
          $ref: '#/components/schemas'
    delete:
      tags:
      - filters_iapi
      summary: DELETE /v2/filters
      operationId: delete_filter_v2_filters_delete
      parameters:
      - description: "Lista identyfikator\xF3w filtra"
        required: true
        schema:
          title: List of id
          minLength: 24
          type: string
          description: A list of id's whose ones are strings representing the ObjectId
            from bson.
          example: 6221c40ca9ab2f868237cd47,6189ba008749c5e836fa4cf6
        name: ids
        in: query
      - required: false
        schema:
          title: Authorization
          type: string
        example: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
        name: Authorization
        in: header
        description: Klucz autoryzacji
      responses:
        '204':
          description: "Wynik usuni\u0119cia filtr\xF3w"
        '400':
          description: "Niew\u0142a\u015Bciwy format zapytania"
          content:
            application/json:
              schema:
                example:
                  error: Bad Request
                  details: One of given ids is incorrect
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Niepoprawna autentykacja tokenu
          content:
            application/json:
              schema:
                example:
                  error: Unauthorized
                  details: User token not provided
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: "Nieudana autoryzacja dost\u0119pu do API"
          content:
            application/json:
              schema:
                example:
                  error: Forbidden
                  details: Incorrect user token
                items:
                  $ref: '#/components/schemas/Error'
      description: "Usuwa filtry o identyfikatorach przekazanych w parametrze `ids`\
        \ w query stringu, \nidentyfikatory musz\u0105 by\u0107 oddzielone przecinkami.\n\
        \nW przypadku sukcesu metoda zwraca kod odpowiedzi `204 No Content`."
      components:
        schemas:
          $ref: '#/components/schemas'
  /v2/monitors/{id}:
    get:
      tags:
      - monitors_iapi
      summary: GET /v2/monitors/{id}
      operationId: get_user_monitor_by_id_v2_monitors__id__get
      parameters:
      - required: true
        schema:
          title: Id
          anyOf:
          - type: string
          - enum:
            - last
            type: string
            description: "Zwraca ostatni dost\u0119pny monitoring"
            maxLength: 4
            minLength: 4
          example: 6221c40c843d0d773f37cd4b
          maxLength: 24
          minLength: 24
        name: id
        in: path
        description: Unikalny identyfikator monitoringu
      - required: false
        schema:
          title: Exclude
          type: array
          items:
            enum:
            - notifications
            type: string
        name: exclude
        in: query
        description: "Pola, kt\xF3re nie b\u0119d\u0105 zwr\xF3cone w odpowiedzi.\n\
          <details><summary>Poka\u017C mo\u017Cliwe opcje</summary>\n\n| Warto\u015B\
          \u0107 | Nazwa  |\n|-|-|\n| `notifications`| Lista powiadomie\u0144 |</details>"
        example:
        - notifications
      - required: false
        schema:
          title: Authorization
          type: string
        example: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
        name: Authorization
        in: header
        description: Klucz autoryzacji
      responses:
        '200':
          description: "Wynik wyszukiwania monitoring\xF3w o okre\u015Blonym identyfikatorze"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorModel'
        '400':
          description: "Niew\u0142a\u015Bciwy format zapytania"
          content:
            application/json:
              schema:
                example:
                  error: Validation error
                  details:
                  - loc:
                    - path
                    - id
                    msg: Invalid objectid
                    type: value_error
                  - loc:
                    - path
                    - id
                    msg: 'unexpected value; permitted: ''last'''
                    type: value_error.const
                    ctx:
                      given: abcd
                      permitted:
                      - last
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Niepoprawna autentykacja tokenu
          content:
            application/json:
              schema:
                example:
                  error: Unauthorized
                  details: User token not provided
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: "Nieudana autoryzacja dost\u0119pu do API"
          content:
            application/json:
              schema:
                example:
                  error: Forbidden
                  details: Incorrect user token
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Nie znaleziono
          content:
            application/json:
              schema:
                example:
                  error: Not Found
                  details: Monitor not found
                items:
                  $ref: '#/components/schemas/Error'
      description: Zwraca monitoring o podanym `id`.
      components:
        schemas:
          $ref: '#/components/schemas'
    patch:
      tags:
      - monitors_iapi
      summary: PATCH /v2/monitors/{id}
      operationId: patch_user_monitors_v2_monitors__id__patch
      parameters:
      - required: true
        schema:
          title: Id
          type: string
          example: 6221c40c843d0d773f37cd4b
          maxLength: 24
          minLength: 24
        name: id
        in: path
        description: Unikalny identyfikator monitoringu
      - required: false
        schema:
          title: Authorization
          type: string
        example: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
        name: Authorization
        in: header
        description: Klucz autoryzacji
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMonitorsModel'
        required: true
      responses:
        '200':
          description: "Wynik aktualizacji monitoring\xF3w u\u017Cytkownika"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorModel'
        '400':
          description: "Niew\u0142a\u015Bciwy format zapytania"
          content:
            application/json:
              schema:
                example:
                  error: Validation error
                  details:
                  - loc:
                    - path
                    - id
                    msg: Invalid objectid
                    type: value_error
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Niepoprawna autentykacja tokenu
          content:
            application/json:
              schema:
                example:
                  error: Unauthorized
                  details: User token not provided
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: "Nieudana autoryzacja dost\u0119pu do API"
          content:
            application/json:
              schema:
                example:
                  error: Forbidden
                  details: Incorrect user token
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Nie znaleziono
          content:
            application/json:
              schema:
                example:
                  error: Not Found
                  details: Monitors not found
                items:
                  $ref: '#/components/schemas/Error'
      description: "Modyfikuje monitoring o podanym `id`.\n\nW parametrze `emails`\
        \ podajemy przynajmniej jeden adres e-mail, na kt\xF3ry b\u0119d\u0105\nwysy\u0142\
        ane powiadomienia o nowych og\u0142oszeniach w ramach monitoringu.\nLiczba\
        \ adres\xF3w e-mail nie mo\u017Ce przekracza\u0107 warto\u015Bci `monitors_emails_limit`\n\
        z parametr\xF3w us\u0142ugi."
      components:
        schemas:
          $ref: '#/components/schemas'
  /v2/users/me:
    get:
      tags:
      - users_iapi
      summary: GET /v2/users/me
      description: "Zwraca aktualne informacje o u\u017Cytkowniku"
      operationId: get_current_user_v2_users_me_get
      parameters:
      - required: false
        schema:
          title: Authorization
          type: string
        example: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
        name: Authorization
        in: header
        description: Klucz autoryzacji
      responses:
        '200':
          description: "Wynik wyszukiwania danych obecnego u\u017Cytkownika"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                example:
                  error: {}
                  details: {}
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Niepoprawna autentykacja tokenu
          content:
            application/json:
              schema:
