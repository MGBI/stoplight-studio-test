tags:
- reports_iapi
summary: Download Report
operationId: download_report_v1_reports__report_id__download_get
parameters:
- required: true
  schema:
    title: Report Id
    anyOf:
    - type: string
    - enum:
      - last
      type: string
  name: report_id
  in: path
- required: false
  schema:
    title: Date From
    type: string
    format: date
  name: date_from
  in: query
- required: false
  schema:
    title: Model
    type: string
  name: model
  in: query
- required: false
  schema:
    title: Projection
    type: string
  name: projection
  in: query
- required: false
  schema:
    $ref: '#/components/schemas/ReportStatusEnum'
  name: status
  in: query
- required: false
  schema:
    title: Authorization
    type: string
  example: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
  name: Authorization
  in: header
- required: false
  schema:
    title: X-Vendor-Authorization
    type: string
  example: imsig-55086cef9c87d6d031cd5db29cd03a2ed0252b45
  name: X-Vendor-Authorization
  in: header
responses:
  '200':
    description: Download a single report
    headers:
      Content-Type:
        description: MIME
        schema:
          type: aplication/zip
      Content-Disposition:
        description: Nazwa pliku
        schema:
          type: attachement
        example: imsig-pl_lista_upadlosci_powiadomienie_2022-03-02_q7jsyvw9.xml.zip
  '400':
    description: Bad Request
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/apps__base__errors__models__Error'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/apps__base__errors__models__Error'
  '403':
    description: Forbidden
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/apps__base__errors__models__Error'
  '404':
    description: Not Found
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/apps__base__errors__models__Error'
  '410':
    description: Gone
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/apps__base__errors__models__Error'
  '422':
    description: Validation Error
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    $ref: ../../common/schemas.yaml
