title: ErasuresModel
required:
- id
- acceptance_datetime
- identity_data
- records
type: object
properties:
  id:
    title: Id
    type: string
  acceptance_datetime:
    title: Acceptance Datetime
    type: string
    format: date-time
  identity_data:
    $ref: ../schemas.yaml#/ErasuresIdentityDataModel
    title: ErasuresIdentityDataModel
    type: object
    properties:
      email:
        title: Email
        type: string
      phone:
        title: Phone
        type: string
      website:
        title: Website
        type: string
      company_name:
        title: Company Name
        type: string
      nip:
        title: Nip
        type: string
      pesel:
        title: Pesel
        type: string
      first_name:
        title: First Name
        type: string
      last_name:
        title: Last Name
        type: string
  scope:
    title: Scope
    type: array
    items:
      type: string
  records:
    title: Records
    type: array
    items:
      title: ErasuresRecordsModel
      required:
      - model
      - id
      type: object
      properties:
        model:
          title: Model
          type: string
        id:
          title: Id
          type: string
        scope:
          title: Scope
          type: array
          items:
            type: string
example:
  id: 66505020425c2b0b16381710
  acceptance_datetime: '2024-02-05T15:55:13.629761+01:00'
  identity_data:
    email: jan@kowalski.pl
    phone: '123456789'
    website: www.wp.pl
    company_name: JanPol Jan Kowalski
    nip: '0000000000'
    pesel: '11111111111'
    first_name: Jan
    last_name: Kowalski
  records:
  - model: pl-mgbi-bnf-record
    id: 66505029425c2b0b16381711
    scope:
    - numbers.nip
    - numbers.pesel
