title: ReportModelV3
required:
- id
- projection
- name
- query
- content
- status
- progress
- file_format
- file_password
- limits
- creation_datetime
- downloads
type: object
properties:
  id:
    title: Id
    type: string
  projection:
    title: Projection
    type: string
  name:
    title: Name
    type: string
  query:
    $ref: ../schemas.yaml#/QueryMessage
    title: QueryMessage
    required:
    - data_service
    - criteria
    type: object
    properties:
      version:
        title: Version
        type: integer
        default: 1
      model:
        title: Model
        type: string
      criteria:
        title: DataQuery
        type: object
        properties:
          version:
            title: Version
            type: integer
            default: 1
          filter_id:
            title: Filter Id
            type: string
      params:
        title: ParamsQuery
        type: object
        properties:
          from_date:
            title: From Date
            type: string
            format: date
          to_date:
            title: To Date
            type: string
            format: date
          update_id_from:
            title: Update Id From
            type: integer
          update_id_to:
            title: Update Id To
            type: integer
          sort:
            title: Sort
            type: array
            items:
              maxItems: 2
              minItems: 2
              type: array
              items:
              - type: string
              - type: integer
          limit:
            title: Limit
            type: integer
        additionalProperties: false
      event_key:
        title: Event Key
        type: string
      constraint:
        title: Constraint
        type: object
    additionalProperties: false
  content:
    title: Content
    type: array
    items:
      type: string
  status:
    $ref: ../schemas.yaml#/ReportStatusEnum
    title: ReportStatusEnum
    enum:
    - 0
    - 1
    - 2
    type: integer
    description: |-
      Aktualny status generowania pliku raportu
      <details>
        <summary>Pokaż możliwe opcje</summary>

        | Wartość | Nazwa |
        |-|-|
        | `0` | Niedostępny |
        | `1` | W przygotowaniu |
        | `2` | Gotowe |
        | `3` | Zarchiwizowany |</details>
  progress:
    title: Progress
    type: integer
  file_format:
    $ref: ../schemas.yaml#/Format
    title: Format
    enum:
    - 1
    - 2
    - 3
    - 4
    - 5
    type: integer
    description: |-
      Format pliku raportu.<details><summary>Pokaż możliwe opcje</summary>

      | Wartość | Nazwa  |
      |-|-|
      | `1` | Csv |
      | `2` | Xlsx |
      | `3` | Xml |
      | `4` | Json |
      | `5` | Def |</details>
  file_password:
    title: File Password
    type: string
  file_encoding:
    allOf:
    - title: Encoding
      enum:
      - 0
      - 1
      - 2
      type: integer
      description: |-
        System kodowania znaków w pliku<details><summary>Pokaż możliwe opcje</summary>

        | Wartość | Nazwa  |
        |-|-|
        | `0` | utf-8 |
        | `1` | cp1250 |
        | `2` | iso-8859-2 |</details>
    default: utf-8
  limits:
    title: Limits
    type: object
    additionalProperties:
      type: integer
  creation_datetime:
    title: Creation Datetime
    type: string
    format: date-time
  records_count:
    title: Records Count
    type: integer
    nullable: true
  downloads:
    title: Downloads
    type: array
    items:
      title: ReportDownloadHistoryModel
      required:
      - download_datetime
      type: object
      properties:
        download_datetime:
          title: Download Datetime
          type: string
          format: date-time
example:
  id: 67ab6f84d17249f4b9d2e127
  projection: default
  type: 0
  name: example raport
  query:
    version: 1
    model: pl-mgbi-lu-announcement
    criteria:
      version: 1
      filter_id: 67ab6f843c65cb5a4bd2e126
      append_first_entry: true
    params:
      from_date: '2021-11-02'
      to_date: '2021-11-04'
  custom_content: []
  status: preparing
  progress: 0
  file_format: xml
  file_password: mgbi2021
  credits_used: 0
  limits:
    reports: 1
    files: 1
  creation_datetime: '2025-02-11T16:40:52.234111+01:00'
  downloads:
  - download_datetime: '2025-02-11T16:40:52.234042+01:00'
  records_count: 3
  file_encoding: utf-8
