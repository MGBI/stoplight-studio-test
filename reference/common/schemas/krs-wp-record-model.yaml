    title: FilesKrsWpModel
    type: object
    properties:
      current_excerpt_pdf:
        title: FileModel
        required:
        - original
        type: object
        properties:
          original:
            title: FileInfoModel
            required:
            - url
            - content_type
            type: object
            properties:
              url:
                title: Url
                type: string
              content_type:
                title: Content Type
                type: string
            description: 'Contains two required fields: `url`, `content_type`.'
          pdf_preview:
            title: FileInfoModel
            required:
            - url
            - content_type
            type: object
            properties:
              url:
                title: Url
                type: string
              content_type:
                title: Content Type
                type: string
            description: 'Contains two required fields: `url`, `content_type`.'
          html_preview:
            title: FileInfoModel
            required:
            - url
            - content_type
            type: object
            properties:
              url:
                title: Url
                type: string
              content_type:
                title: Content Type
                type: string
            description: 'Contains two required fields: `url`, `content_type`.'
        description: Contains `original`, `pdf_preview` (optional), `html_preview`
          (optional) fields.
      full_excerpt_pdf:
        title: FileModel
        required:
        - original
        type: object
        properties:
          original:
            title: FileInfoModel
            required:
            - url
            - content_type
            type: object
            properties:
              url:
                title: Url
                type: string
              content_type:
                title: Content Type
                type: string
            description: 'Contains two required fields: `url`, `content_type`.'
          pdf_preview:
            title: FileInfoModel
            required:
            - url
            - content_type
            type: object
            properties:
              url:
                title: Url
                type: string
              content_type:
                title: Content Type
                type: string
            description: 'Contains two required fields: `url`, `content_type`.'
          html_preview:
            title: FileInfoModel
            required:
            - url
            - content_type
            type: object
            properties:
              url:
                title: Url
                type: string
              content_type:
                title: Content Type
                type: string
            description: 'Contains two required fields: `url`, `content_type`.'
        description: Contains `original`, `pdf_preview` (optional), `html_preview`
          (optional) fields.
  meta:
    $ref: ../schemas.yaml#/MetaKrsWpModel
    title: MetaKrsWpModel
    type: object
