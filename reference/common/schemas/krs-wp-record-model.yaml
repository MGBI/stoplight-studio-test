    title: IdentifiersKrsWpModel
    type: object
    properties:
      register_type:
        title: RegisterTypesEnum
        enum:
        - P
        - S
        type: string
        description: |-
          An enumeration.<details><summary>Pokaż możliwe opcje</summary>

          | Wartość | Nazwa  |
          |-|-|
          | `P` | Company |
          | `S` | Association |</details>
      pl_krs:
        title: Pl Krs
        type: string
      pl_nip:
        title: Pl Nip
        type: string
      pl_regon:
        title: Pl Regon
        type: string
      pl_pesel:
        title: IdentifiersPeselKrsWpModel
        type: object
        properties:
          full:
            title: Full
            type: array
            items:
              type: string
          current:
            title: Current
            type: array
            items:
              type: string
  content:
