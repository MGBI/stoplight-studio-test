title: AnnouncementModel
required:
- id
- meta
type: object
properties:
  id:
    title: Id
    type: string
    description: |-
      Unikalny identyfikator ogłoszenia
      <details>
        <summary>Przykładowy identyfikator</summary>
        "6189ba008749c5e836fa4cf6"
      </details>
    format: ObjectId
  meta:
    $ref: ../schemas.yaml#/MetaModel
    title: MetaModel
    description: Informacje o ogłoszeniu
    required:
    - issue_date
    - category
    - first_update_date
    - last_update_date
    - is_administrator_data_consistent
    - is_correction
    - is_entity_data_consistent
    - last_refresh_date
    type: object
    properties:
      last_refresh_date:
        title: Last Refresh Date
        type: string
        format: date-time
        description: Data ostatniego odświeżenia ogłoszenia
      issue_date:
        title: Issue Date
        type: string
        format: date
        description: Data publikacji ogłoszenia
      category:
        title: CategoriesEnum
        enum:
        - K
        - K.0
        - K.0.0
        - K.0.0.0
        - K.0.2
        - K.0.5
        - K.0.6
        - K.0.6.4
        - K.0.7
        - K.0.8
        - K.0.9
        - K.0.10
        - K.1.22
        - K.0.1
        - K.0.1.1
        - K.0.2.2
        - K.0.3
        - K.0.3.3
        - K.0.4
        - K.1
        - K.1.20
        - K.1.20.30
        - K.1.21
        - K.1.21.32
        - K.1.22.31
        - K.1.22.35
        - K.1.23
        - K.1.24
        - K.1.25
        - K.1.26
        - K.1.27
        - K.1.28
        - K.1.29
        - K.1.30
        - K.1.31
        - K.1.31.34
        - K.1.32
        - K.1.33
        - K.1.34
        - K.1.34.33
        - K.2
        - K.2.40
        - K.2.41
        - M
        - M.0
        - M.0.1
        - M.0.2
        - M.0.3
        - M.0.4
        - M.0.5
        - M.0.6
        - M.0.7
        - M.0.8
        - M.0.9
        - M.1
        - M.1.20
        - M.1.21
        - M.1.22
        - M.1.23
        - M.1.24
        - M.1.25
        - M.1.26
        - M.1.27
        - M.1.28
        - M.1.29
        - M.1.30
        - M.1.31
        - M.1.32
        - M.1.33
        - M.1.34
        - M.1.35
        - M.1.36
        - M.1.37
        - M.1.38
        - M.1.39
        - M.1.40
        - M.1.41
        - M.1.42
        - M.1.43
        - M.1.44
        - M.1.45
        - M.1.46
        - M.1.47
        - M.1.48
        - M.1.49
        - M.1.50
        type: string
        description: Identyfikator kategorii. Lista możliwych wartości dostępna jest
          pod adresem [/v2/dicts/announcement-categories](#operation/get_announcement_category_v2_dicts_announcement_categories_get)
      first_update_date:
        title: First Update Date
        type: string
        format: date
        description: Data pierwszej aktualizacji ogłoszenia
      last_update_date:
        title: Last Update Date
        type: string
        format: date
        description: Data ostatniej aktualizacji ogłoszenia
      is_administrator_data_consistent:
        title: Is Administrator Data Consistent
        type: boolean
        description: Czy dane nadzorcy z nagłówka są zgodne z danymi w treści?
      is_correction:
        title: Is Correction
        type: boolean
        description: Czy ogłoszenie jest sprostowaniem?
      is_entity_data_consistent:
        title: Is Entity Data Consistent
        type: boolean
        description: Czy numery rejestrowe dłużnika z nagłówka są zgodne z danymi
          w treści?
  entity:
    title: Entity
    items:
      required:
      - info
      - address
      - numbers
      type: object
      properties:
        info:
          required:
          - cleaned_name
          properties:
            birth_date:
              type: string
              format: date
              description: Data urodzenia
            commencement_date:
              type: string
              format: date
              description: Data rozpoczęcia działalności
            first_name:
              type: string
              description: Imię
            last_name:
              type: string
              description: Nazwisko
            cleaned_name:
              type: string
              description: Nazwa podmiotu
            primary_business:
              type: string
              description: Przeważająca działalność gospodarcza (kod PKD)
            ownership_type:
              type: string
              description: Forma własności
            legal_form:
              type: string
              description: Forma prawna
          type: object
          description: Podstawowe dane podmiotu
        address:
          properties:
            town:
              type: string
              description: Miejscowość
            gmina:
              type: string
              description: Gmina
            house_number:
              type: string
              description: Numer nieruchomości
            flat_number:
              type: string
              description: Numer lokalu
            state:
              type: string
              description: Województwo
            street:
              type: string
              description: Ulica
            post_office:
              type: string
              description: Poczta
            powiat:
              type: string
              description: Powiat
            zip_code:
              type: string
              description: Kod pocztowy
          type: object
          description: Adres pocztowy siedziby podmiotu lub miejsca zamieszkania
        numbers:
          properties:
            krs:
              minLength: 10
              maxLength: 10
              type: string
              description: Numer KRS
            nip:
              minLength: 10
              maxLength: 10
              type: string
              description: Numer NIP
            regon:
              minLength: 9
              maxLength: 9
              type: string
              description: Numer REGON
            pesel:
              minLength: 11
              maxLength: 11
              type: string
              description: Numer PESEL
          type: object
          description: Numery rejestrowe podmiotu
    type: array
    description: Lista podmiotów, których dotyczy ogłoszenie
  proceeding:
    title: Proceeding
    type: object
    required:
    - signatures
    properties:
      termination_date:
        type: string
        format: date
        description: Data zakończenia postępowania
      registration_date:
        type: string
        format: date
        description: Data rejestracji postępowania
      type:
        type: string
        description: Rodzaj postępowania
      status:
        type: string
        description: Status postępowania na dzień publikacji ogłoszenia
      main_signature:
        type: string
        description: Główna sygnatura postępowania
      signatures:
        items:
          type: string
        type: array
        description: Sygnatury postępowania
      commissioner_name:
        type: string
        description: Imię i nazwisko sędziego komisarza
      court_department:
        type: string
        description: Nazwa wydziału
      administrator_zip_code:
        type: string
        description: Kod pocztowy w adresie nadzorcy
      administrator_function:
        type: string
        description: Funkcja nadzorcy
      court_name:
        type: string
        description: Nazwa sądu
      administrator_name:
        type: string
        description: Imię i nazwisko nadzorcy
      commissioner_deputy_name:
        type: string
        description: Imię i nazwisko zastępcy sędziego komisarza
      administrator_town:
        type: string
        description: Miejscowość w adresie nadzorcy
      administrator_licence_number:
        type: integer
        description: Numer licencji doradcy restrukturyzacyjnego nadzorcy
      administrator_address:
        type: string
        description: Adres pocztowy nadzorcy
      administrator_source_url:
        type: string
        format: uri
        description: Link do źródła danych nadzorcy
    description: Informacje o postępowaniu
  order:
    title: Order
    type: object
    required:
    - order_date
    - expiration_period
    - expiration_date
    properties:
      order_date:
        type: string
        format: date
        description: Data wydania postanowienia
      expiration_period:
        type: integer
        description: Okres do działania (w dniach)
      expiration_date:
        type: string
        format: date
        description: Data końcowa okresu do działania
    description: Informacje o postanowieniu, którego dotyczy ogłoszenie
  msig_entry:
    title: Msig Entry
    type: object
    required:
    - chapter
    - section
    - signature
    - issue_date
    - yearly_number
    - position_number
    - url
    properties:
      chapter:
        type: integer
        description: Rozdział MSiG
      position_number:
        type: string
        description: |-
          Numer pozycji MSiG
          <details>
            <summary>Przykładowy numer pozycji</summary>
            "00000"
          </details>
      issue_date:
        type: string
        description: |-
          Data publikacji ogłoszenia w MSiG
          <details>
            <summary>Przykładowa data</summary>
            "2021-12-08"
          </details>
        format: date
      signature:
        type: string
        description: |-
          Sygnatura ogłoszenia w MSiG
          <details>
            <summary>Przykładowa sygnatura MSiG</summary>
            "BMSiG-68636/2021"
          </details>
      url:
        type: string
        example: http://www.imsig.pl/pozycja/2020/112/26734
        description: |-
          Link do ogłoszenia w serwisie imsig.pl
          <details>
            <summary>Przykładowy link do ogłoszenia</summary>
            "http://www.imsig.pl/pozycja/2020/112/26734"
          </details>
        format: uri
      section:
        type: integer
        description: Sekcja MSiG
      yearly_number:
        type: string
        description: |-
          Numer wydania MSiG
          <details>
            <summary>Przykładowy nr wydania</summary>
            "214"
          </details>
    description: Informacje dotyczące publikacji ogłoszenia w MSiG
  krz_entry:
    title: Krz Entry
    type: object
    required:
    - chapter
    - section
    - subsection
    - signature
    - issue_date
    - url
    properties:
      chapter:
        type: integer
        description: Rozdział KRZ
      url:
        type: string
        description: Link do ogłoszenia w serwisie KRZ
        format: uri
      section:
        type: integer
        description: Sekcja KRZ
      subsection:
        type: integer
        description: Podsekcja KRZ
      issue_date:
        type: string
        description: Data publikacji ogłoszenia w KRZ
        format: date
      signature:
        type: string
        description: Sygnatura ogłoszenia w KRZ
    description: Informacje dotyczące publikacji ogłoszenia w KRZ
  content:
    title: Content
    type: object
    required:
    - text
    - html
    - url
    properties:
      text:
        type: string
        description: Treść ogłoszenia w formacie tekstowym
      html:
        type: string
        format: html
        description: Treść ogłoszenia w formacie HTML
      url:
        type: string
        format: url
        description: Link do podglądu treści ogłoszenia
    description: Nieprzetworzona treść ogłoszenia
example:
  id: 642d7d281c62e3a72c70cd8d
  meta:
