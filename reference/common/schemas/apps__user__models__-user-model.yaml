title: UserModel
required:
- id
- email
- is_active
- is_admin
- creation_datetime
type: object
properties:
  id:
    title: Id
    type: string
  email:
    title: Email
    type: string
    format: email
  is_active:
    title: Is Active
    type: boolean
  is_admin:
    title: Is Admin
    type: boolean
  creation_datetime:
    title: Creation Datetime
    type: string
    format: date-time
  deactivation_datetime:
    title: Deactivation Datetime
    type: string
    format: date-time
    nullable: true
example:
  id: 67ab6f838b7bbf8874d2e120
  email: abc@mgbi.pl
  is_active: true
  is_admin: false
  creation_datetime: '2025-02-10T16:40:51.885705+01:00'
  deactivation_datetime: '2025-06-10T16:40:51.886114+02:00'
